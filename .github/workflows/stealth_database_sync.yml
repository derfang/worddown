name: Stealth WordUp Database Sync

on:
  schedule:
    # Runs every 6 hours (4 times a day: 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of words to fetch in this run'
        required: false
        default: '500'
        type: string
      max_rank:
        description: 'Max word frequency rank to include'
        required: false
        default: '50000'
        type: string
      min_delay:
        description: 'Minimum delay between requests (seconds)'
        required: false
        default: '1.5'
        type: string
      max_delay:
        description: 'Maximum delay between requests (seconds)'
        required: false
        default: '3.5'
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install cryptography

      - name: Download existing database from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to download existing database from release 'database-latest'..."
          gh release download database-latest --pattern "wordup_database.db" || echo "No existing database found. Starting new database."

      - name: Run Stealth Sync
        run: |
          python scripts/stealth_sync.py \
            --batch-size "${{ inputs.batch_size || '500' }}" \
            --max-rank "${{ inputs.max_rank || '50000' }}" \
            --min-delay "${{ inputs.min_delay || '1.5' }}" \
            --max-delay "${{ inputs.max_delay || '3.5' }}" \
            --api-dir "api_words"

      - name: Check Database Stats
        run: |
          python -c "import sqlite3; conn = sqlite3.connect('wordup_database.db'); count = conn.execute('SELECT COUNT(*) FROM word_data').fetchone()[0]; print(f'>>> CURRENT TOTAL SYNCED WORDS: {count} <<<')"

      - name: Deploy Encrypted Files to API Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "api_words" ] && [ "$(ls -A api_words)" ]; then
            echo "Deploying encrypted files to 'api' branch..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Clone api branch or create it if not present
            git clone --branch api "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" api_repo 2>/dev/null || {
              echo "Branch 'api' does not exist yet. Initializing new orphan branch..."
              mkdir api_repo
              cd api_repo
              git init
              git checkout -b api
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
              echo "# WordDown Encrypted REST API Branch" > README.md
              git add README.md
              git commit -m "Initialize api branch"
              git push -u origin api
              cd ..
            }

            mkdir -p api_repo/words
            cp -r api_words/* api_repo/words/
            cd api_repo
            git add words/
            if ! git diff --cached --quiet; then
              COUNT=$(ls -1 words/*.enc | wc -l)
              git commit -m "Sync $COUNT encrypted words to API branch [skip ci]"
              git push origin api
              echo "Successfully pushed $COUNT encrypted words to 'api' branch."
            else
              echo "No new encrypted files to commit on 'api' branch."
            fi
            cd ..
            rm -rf api_repo
          fi

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordup-database
          path: wordup_database.db
          retention-days: 7

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "wordup_database.db" ]; then
            TOTAL_WORDS=$(python -c "import sqlite3; conn = sqlite3.connect('wordup_database.db'); print(conn.execute('SELECT COUNT(*) FROM word_data').fetchone()[0])")
            RELEASE_BODY="### WordUp SQLite Database (Latest)\n\n- **Total Words Synced:** $TOTAL_WORDS\n- **Last Updated:** $(date -u)\n- **Format:** SQLite 3\n\nContains complete definitions, senses, tips, celebrity quotes, and image CDN URLs."
            
            # Create release if it doesn't exist, or update the asset
            gh release view database-latest >/dev/null 2>&1 || gh release create database-latest --title "WordUp SQLite Database (Latest)" --notes "$RELEASE_BODY"
            
            echo "Uploading updated wordup_database.db to release 'database-latest'..."
            gh release upload database-latest wordup_database.db --clobber
            gh release edit database-latest --notes "$RELEASE_BODY"
          fi
