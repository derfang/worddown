name: Build & Release WordDown

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
      publish_release:
        description: 'Publish assets to GitHub Release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (Universal & Split APKs)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "Restoring Android release signing key..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            echo "$KEY_PROPERTIES" > android/key.properties
            echo "Android signing configured successfully."
          else
            echo "::warning ::Android signing secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PROPERTIES) not found. Build will proceed without custom release keystore."
          fi

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split Release APKs per ABI
        run: flutter build apk --release --split-per-abi

      - name: Package Android Artifacts
        run: |
          mkdir -p releases/Android
          
          # Copy Universal APK
          cp build/app/outputs/flutter-apk/app-release.apk releases/Android/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk releases/Android/WordDown-Universal.apk
          
          # Copy Split APKs
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk releases/Android/WordDown-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk releases/Android/WordDown-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk releases/Android/WordDown-x86_64.apk
          
          # Create repository-invariant ZIP bundle
          cd releases/Android && zip -r WordDown_Android.zip app-release.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WordDown-Android
          path: releases/Android/*

  build-windows:
    name: Build Windows (Portable ZIP & Inno Setup Installer)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release (x64)
        shell: pwsh
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "releases/Windows"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\packaging\installer.iss

      - name: Package Portable Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "releases/Windows/WordDown_Windows.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WordDown-Windows
          path: releases/Windows/*

  publish-release:
    name: Publish Release Assets
    needs: [build-android, build-windows]
    if: always() && (github.event_name == 'push' || inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Prepare Release Directory
        run: |
          mkdir -p release_assets
          find all_artifacts -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=latest-preview" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.TAG_NAME }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.release_info.outputs.IS_PRERELEASE }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          # Create release if it doesn't exist
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $PRERELEASE_FLAG --title "WordDown $TAG" --notes "Automated release build for Android and Windows."
          
          for file in release_assets/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file to release $TAG..."
              gh release upload "$TAG" "$file" --clobber
            fi
          done
